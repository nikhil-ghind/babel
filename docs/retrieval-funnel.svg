<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Babel retrieval funnel: query rewriting and expansion, dense plus BM25 search, RRF fusion, Cohere rerank, top-5 grounded answer, with a grade-FAIL loop back to rewrite">
  <title>Babel retrieval funnel with self-correction loop</title>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="bold" fill="#8b949e">Babel retrieval funnel</text>
  <text x="20" y="48" font-family="sans-serif" font-size="13" fill="#8b949e">one question fans out to 4 queries, two indexes, ~20 fused candidates, then narrows to the 5 passages that ground the answer</text>

  <!-- edges -->
  <path id="e1" d="M122,200 L152,200" stroke="#6e7681" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e2" d="M282,200 C302,200 302,132 322,132" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e3" d="M282,200 C302,200 302,268 322,268" stroke="#d29922" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e4" d="M452,132 C472,132 472,200 492,200" stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e5" d="M452,268 C472,268 472,200 492,200" stroke="#d29922" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e6" d="M622,200 L662,200" stroke="#a371f7" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <path id="e7" d="M792,200 L822,200" stroke="#3fb950" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>

  <!-- self-correction loop -->
  <path id="loop" d="M885,246 C885,360 420,372 217,372 L217,248" stroke="#f85149" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arw)"/>
  <text x="470" y="390" font-family="sans-serif" font-size="13" fill="#f85149">grade = FAIL and iterations &lt; 3 &#8594; rewrite the query and retrieve again</text>

  <!-- stage boxes -->
  <rect x="22" y="176" width="100" height="48" rx="7" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <text x="72" y="197" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">question</text>
  <text x="72" y="214" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">any language</text>

  <rect x="152" y="164" width="130" height="72" rx="7" fill="none" stroke="#6e7681" stroke-width="1.6"/>
  <text x="217" y="186" font-family="sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">rewrite + expand</text>
  <text x="217" y="204" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Cohere Command</text>
  <text x="217" y="224" font-family="sans-serif" font-size="13" fill="#a371f7" text-anchor="middle">1 &#8594; 4 queries</text>

  <rect x="322" y="106" width="130" height="52" rx="7" fill="none" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="387" y="127" font-family="sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">dense cosine</text>
  <text x="387" y="145" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">embed-multilingual</text>

  <rect x="322" y="242" width="130" height="52" rx="7" fill="none" stroke="#d29922" stroke-width="1.6"/>
  <text x="387" y="263" font-family="sans-serif" font-size="13" fill="#d29922" text-anchor="middle">BM25 lexical</text>
  <text x="387" y="281" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">rank-bm25</text>

  <rect x="492" y="164" width="130" height="72" rx="7" fill="none" stroke="#a371f7" stroke-width="1.6"/>
  <text x="557" y="186" font-family="sans-serif" font-size="13" fill="#a371f7" text-anchor="middle">RRF fusion</text>
  <text x="557" y="204" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">sum 1/(k + rank)</text>
  <text x="557" y="224" font-family="sans-serif" font-size="13" fill="#a371f7" text-anchor="middle">~20 candidates</text>

  <rect x="662" y="164" width="130" height="72" rx="7" fill="none" stroke="#a371f7" stroke-width="1.6"/>
  <text x="727" y="186" font-family="sans-serif" font-size="13" fill="#a371f7" text-anchor="middle">Cohere Rerank</text>
  <text x="727" y="204" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">cross-encoder</text>
  <text x="727" y="224" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">re-scores every pair</text>

  <rect x="822" y="164" width="126" height="82" rx="7" fill="none" stroke="#3fb950" stroke-width="1.6"/>
  <text x="885" y="186" font-family="sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">top 5 passages</text>
  <text x="885" y="204" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">grounded answer</text>
  <text x="885" y="222" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">inline [n] citations</text>
  <text x="885" y="240" font-family="sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">then graded</text>

  <!-- travelling particles -->
  <circle r="5" fill="#8b949e">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.13;1" calcMode="linear">
      <mpath href="#e1" xlink:href="#e1"/>
    </animateMotion>
  </circle>

  <g fill="#58a6ff">
    <circle r="4.5"><animateMotion dur="6s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
  </g>

  <g fill="#d29922">
    <circle r="4.5"><animateMotion dur="6s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="1.7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
  </g>

  <g fill="#58a6ff">
    <circle r="4.5"><animateMotion dur="6s" begin="2.3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="2.9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
  </g>

  <g fill="#d29922">
    <circle r="4.5"><animateMotion dur="6s" begin="2.3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="2.9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.17;1" calcMode="linear"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
  </g>

  <g fill="#a371f7">
    <circle r="4.5"><animateMotion dur="6s" begin="3.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="3.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="6s" begin="4.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
  </g>

  <g fill="#3fb950">
    <circle r="5"><animateMotion dur="6s" begin="4.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.09;1" calcMode="linear"><mpath href="#e7" xlink:href="#e7"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="6s" begin="4.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.09;1" calcMode="linear"><mpath href="#e7" xlink:href="#e7"/></animateMotion></circle>
  </g>

  <circle r="5" fill="#f85149" opacity="0">
    <animateMotion dur="6s" begin="5.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.13;1" calcMode="linear"><mpath href="#loop" xlink:href="#loop"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.13;0.15;1" dur="6s" begin="5.2s" repeatCount="indefinite"/>
  </circle>
</svg>
